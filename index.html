<!DOCTYPE html>
<html>
    <head>
        <title>SPRING</title>
        <h1>SPRING</h1>
        <p>Green Habits, Greener Earth</p>
        <button>menu</button>
        <link href="style.css" rel="stylesheet" type="text/css">
        <script defer src="script.js"></script>
    </head>
    <body>
        <h2>What language would you like to continue in?</h2>
        <div class="languageButtons">
            <button class="persian">Persian</button>
            <button class="english">English</button>
            <button class="spanish">Spanish</button>
            <button class="german">German</button>
            <button class="arabiac">Arabiac</button>
            <button class="turkish">Turkish</button>
            <button class="french">French</button>
            <button class="hindi">Hindi</button>
        </div>
        <h2>Log in to SPRING</h2>
        <p>Sign into your account</p>
        <div class="logInBox">
            <h3>Username:</h3>
            <input class="username">
            <h3>Password:</h3>
            <input class="password">
            <button class="logIn">Log In</button>
            <button class="createAccount">Create an Account</button>
        </div>
    </body>
</html>
